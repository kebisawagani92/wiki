<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>品川シーサイド → 羽田空港 バス検索</title><style>
:root{color-scheme:light dark;--bg:#eef0ed;--card:#fff;--ink:#1f3029;--muted:#586960;--line:#d9e2db;--accent:#207a60;--soft:#e3f4ec}@media(prefers-color-scheme:dark){:root{--bg:#171c19;--card:#242d27;--ink:#edf5ef;--muted:#b1c1b7;--line:#415147;--accent:#85dfb8;--soft:#263e32}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}main{max-width:900px;margin:auto;padding:24px 20px 60px}a{color:var(--accent)}h1{font-size:clamp(1.5rem,5vw,2.1rem);line-height:1.4;margin:18px 0 8px}h2{font-size:1.12rem;margin:0 0 12px}.muted{color:var(--muted);font-size:.87rem}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:20px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-weight:650;font-size:.9rem}input,select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:48px;width:100%;margin-top:6px}button{cursor:pointer;color:var(--accent);font-weight:700}.actions{display:flex;gap:10px;margin-top:12px}.actions button{width:auto}.hero{background:var(--soft)}.journey{display:flex;align-items:center;gap:22px;margin:18px 0}.journey strong{font-size:clamp(2rem,8vw,3.3rem);font-variant-numeric:tabular-nums;line-height:1.25}.journey small{display:block;color:var(--muted);font-size:.85rem;white-space:nowrap}.arrow{font-size:1.5rem;color:var(--muted)}.badge{display:inline-block;border:1px solid var(--accent);color:var(--accent);border-radius:99px;padding:3px 12px;font-size:.83rem}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:12px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:.83rem}caption{text-align:left;color:var(--muted);font-size:.85rem;padding-bottom:10px}summary{cursor:pointer;font-weight:700}details .scroll{margin-top:14px}p{margin:8px 0}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px} @media(max-width:520px){main{padding:18px 14px 40px}.panel{padding:18px 14px}.controls{grid-template-columns:1fr}.journey{flex-direction:column;align-items:flex-start;gap:10px}.journey small{max-width:none}.journey .arrow{transform:rotate(90deg);line-height:1;margin-left:20px}th,td{padding:10px 6px}}
</style></head><body><main>
<a href="../portal/">← ポータル</a><h1>品川シーサイド → 羽田空港</h1><p>空港連絡バスの次の便を探す</p><p class="muted">品川シーサイド駅 2番のりば · 毎日運行（平日・土休日共通）</p>
<section class="panel" aria-label="検索条件"><div class="controls"><label>到着ターミナル<select id="terminal"><option value="1">羽田空港 第2ターミナル</option><option value="2">羽田空港 第1ターミナル</option><option value="3">羽田空港 第3ターミナル</option></select></label><label>この時刻以降に出発（日本時間）<input id="time" type="time" required step="60"></label></div><div class="actions"><button id="now" type="button">現在時刻に戻す</button></div><p id="mode" class="muted"></p></section>
<section class="panel hero" aria-labelledby="next-title" aria-live="polite"><h2 id="next-title">次の便</h2><div id="next"></div></section>
<section class="panel"><h2>指定時刻以降の便</h2><div class="scroll"><table><caption id="remaining-caption"></caption><thead><tr><th>品川シーサイド 出発</th><th id="arrival-heading"></th></tr></thead><tbody id="remaining"></tbody></table></div></section>
<section class="panel"><details><summary>1日すべての便・各ターミナルの到着時刻</summary><div class="scroll"><table><caption>すべて日本時間。第2 → 第1 → 第3ターミナルの順に停車。</caption><thead><tr><th>品川シーサイド 出発</th><th>羽田空港 第2ターミナル 到着</th><th>羽田空港 第1ターミナル 到着</th><th>羽田空港 第3ターミナル 到着</th></tr></thead><tbody id="all"></tbody></table></div></details></section>
<section class="panel"><h2>ご利用案内</h2><p>片道 大人800円・小児400円。6:39発は東急バス、その他は京浜急行バス。</p></section><noscript>検索にはJavaScriptを有効にしてください。</noscript>
</main><script>
'use strict';
const timetable=[['05:49','06:07','06:12','06:19'],['06:09','06:27','06:32','06:39'],['06:39','06:57','07:02','07:09'],['07:11','07:27','07:32','07:39'],['08:11','08:27','08:32','08:39'],['09:11','09:27','09:32','09:39'],['10:11','10:27','10:32','10:39'],['11:55','12:17','12:22','12:29'],['13:50','14:12','14:17','14:24'],['15:20','15:42','15:47','15:54'],['16:20','16:42','16:47','16:54'],['17:20','17:42','17:47','17:54'],['18:50','19:12','19:17','19:24'],['20:44','21:02','21:07','21:14'],['21:24','21:42','21:47','21:54']];
const names={1:'羽田空港 第2ターミナル',2:'羽田空港 第1ターミナル',3:'羽田空港 第3ターミナル'};
function minutes(time){const [h,m]=time.split(':').map(Number);return h*60+m;}
function remainingAt(time){return timetable.filter(row=>minutes(row[0])>=minutes(time));}
function japanTime(date=new Date()){return new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(date);}
const $=id=>document.getElementById(id);let live=true;
function render(){const time=$('time').value,terminal=Number($('terminal').value);if(!/^\d{2}:\d{2}$/.test(time)){return;}const rows=remainingAt(time);const label=names[terminal];
$('mode').textContent=live?'現在時刻に連動中（日本時間・30秒ごとに更新）':'指定した時刻で検索中（日本時間）';
$('arrival-heading').textContent=label+' 到着';$('remaining-caption').textContent=time+'以降：'+rows.length+'便';
$('remaining').innerHTML=rows.length?rows.map(row=>'<tr><th scope="row">'+row[0]+'</th><td>'+row[terminal]+'</td></tr>').join(''):'<tr><td colspan="2">この時刻以降の便はありません。</td></tr>';
if(rows.length){const row=rows[0],wait=minutes(row[0])-minutes(time);$('next-title').textContent='次の便';$('next').innerHTML='<span class="badge">'+(live?'現在時刻':'指定時刻')+'から'+wait+'分後</span><div class="journey"><div><small>品川シーサイド 出発</small><strong>'+row[0]+'</strong></div><span class="arrow" aria-hidden="true">→</span><div><small>'+label+' 到着</small><strong>'+row[terminal]+'</strong></div></div><p>所要時間の目安 '+(minutes(row[terminal])-minutes(row[0]))+'分</p>';}
else{$('next-title').textContent=live?'本日の便は終了しました':'指定時刻以降の便はありません';$('next').innerHTML='<p>翌日の始発は <strong>05:49</strong> 発です。</p><p>'+label+' <strong>'+timetable[0][terminal]+'</strong> 到着予定。</p>';}}
function useNow(){live=true;$('time').value=japanTime();render();}
$('all').innerHTML=timetable.map(row=>'<tr><th scope="row">'+row[0]+'</th>'+row.slice(1).map(t=>'<td>'+t+'</td>').join('')+'</tr>').join('');
$('time').addEventListener('input',()=>{live=false;render();});$('terminal').addEventListener('change',render);$('now').addEventListener('click',useNow);useNow();setInterval(()=>{if(live)useNow();},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&live)useNow();});
</script></body></html>

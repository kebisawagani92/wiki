<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ジョハリの窓</title>
<style>
  body{margin:0; color:#16202e; line-height:1.7; -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(1100px 620px at 12% -12%, rgba(37,99,235,.13), transparent 62%),
      radial-gradient(900px 520px at 96% 112%, rgba(5,150,105,.12), transparent 60%),
      #f5f7fb;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",-apple-system,"Segoe UI",sans-serif;}
  .box{max-width:460px; margin:16vh auto 0; padding:26px 24px; border-radius:16px;
    background:linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.82));
    border:1px solid rgba(16,32,56,.10); box-shadow:0 14px 40px rgba(16,32,56,.14);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);}
  h1{font-size:17px; font-weight:800; margin:0 0 10px; letter-spacing:.01em;
    background:linear-gradient(92deg,#16202e 10%,#2563EB 55%,#059669 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  p{font-size:13px; color:#6b7684; margin:6px 0;}
  input{width:100%; padding:10px 12px; border-radius:9px; border:1px solid rgba(16,32,56,.16);
    background:#fff; color:#16202e; font-size:13px; box-sizing:border-box; outline:none;}
  input:focus{border-color:rgba(37,99,235,.6); box-shadow:0 0 0 3px rgba(37,99,235,.14);}
  button{margin-top:14px; padding:10px 20px; border:none; border-radius:9px;
    background:linear-gradient(92deg,#2563EB,#059669); color:#fff; font-weight:800; font-size:13px;
    cursor:pointer; box-shadow:0 6px 18px rgba(37,99,235,.24);}
  button:hover{filter:brightness(1.07);}
  .err{color:#E11D48; font-size:12.5px; min-height:1em;}
  .muted{font-size:11.5px; color:#8b96a5;}
</style>
</head>
<body>
<div class="box" id="setup" hidden>
  <h1>ジョハリの窓 ― アクセス設定</h1>
  <p>データ用リポジトリの読み取りトークン（fine-grained PAT）を入力してください。Wikiで設定済みのトークンがあれば自動で使用されます。</p>
  <input type="password" id="tok" placeholder="github_pat_...">
  <button id="go">保存して表示</button>
  <p class="err" id="err"></p>
  <p class="muted">トークンはこのブラウザのlocalStorageにのみ保存されます。</p>
</div>
<div class="box" id="loading"><h1>読み込み中…</h1></div>
<script>
(function(){
  var SRC={owner:'kebisawagani92', repo:'wiki-data', path:'johari/page.html', branch:'main'};
  var el=function(id){return document.getElementById(id);};
  function token(){ return localStorage.getItem('cfGhToken') || localStorage.getItem('wikiGhToken') || ''; }
  function showSetup(msg){ el('loading').hidden=true; el('setup').hidden=false; el('err').textContent=msg||''; }
  function load(){
    var t=token();
    if(!t){ showSetup(''); return; }
    var url='https://api.github.com/repos/'+SRC.owner+'/'+SRC.repo+'/contents/'+SRC.path+'?ref='+SRC.branch+'&_='+Date.now();
    fetch(url,{cache:'no-store', headers:{Authorization:'Bearer '+t, Accept:'application/vnd.github.raw+json', 'If-None-Match':''}})
      .then(function(res){
        if(!res.ok) throw new Error('HTTP '+res.status+(res.status===401?'（トークン無効）':res.status===404?'（権限不足 or ファイルなし）':''));
        return res.text();
      })
      .then(function(html){ document.open(); document.write(html); document.close();
        try{var _pl=document.createElement('a');_pl.href='../portal/';_pl.textContent='≡ ポータル';_pl.setAttribute('style','position:fixed;left:12px;bottom:12px;z-index:2147483000;font:700 12px sans-serif;background:linear-gradient(92deg,#2563EB,#059669);color:#fff;padding:7px 13px;border-radius:999px;text-decoration:none;box-shadow:0 4px 14px rgba(16,32,56,.28)');document.body.appendChild(_pl);}catch(e){} })
      .catch(function(e){ showSetup('読み込み失敗: '+e.message); });
  }
  el('go').addEventListener('click',function(){
    var v=el('tok').value.trim();
    if(!v){ el('err').textContent='トークンを入力してください'; return; }
    localStorage.setItem('cfGhToken',v);
    el('setup').hidden=true; el('loading').hidden=false; load();
  });
  load();
})();
</script>
</body>
</html>
